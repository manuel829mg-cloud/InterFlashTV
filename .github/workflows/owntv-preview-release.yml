name: Publish permanently signed OwnTV v0.19
on:
  push:
    branches: [codex/owntv-v019-fast-start]
    paths: ['release/v019-apk-signature.json', 'release/rebuild_signed_apk.py', 'release/notes-v019.md', '.github/workflows/owntv-preview-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the exact tested build
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('release/v019-apk-signature.json'))['build_run_id'])")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name InterFlashTV-OwnTV-v0.19-build --dir build-artifact
      - name: Reassemble the already signed APK
        run: python release/rebuild_signed_apk.py
      - name: Verify application and permanent certificate
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs distribution/InterFlashTV-OwnTV-v0.19-prueba.apk > verified-certificate.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import os
          cert = Path('verified-certificate.txt').read_text()
          assert 'b4ae6bafa2c790205e03fd4b34e71b8a272709027f1424df3ec5f85a625917b1' in cert
          text = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/36.0.0/aapt', 'dump', 'badging', 'distribution/InterFlashTV-OwnTV-v0.19-prueba.apk'], text=True)
          assert "name='com.interflash.tv.player'" in text and "versionCode='19'" in text
          PY
      - name: Publish complete release
        run: |
          if gh release view v0.19 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release v0.19 already exists; inspect it before replacing any asset.'
            exit 1
          fi
          gh release create v0.19 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'Inter Flash TV v0.19 — inicio rápido del reproductor' --notes-file release/notes-v019.md distribution/InterFlashTV-OwnTV-v0.19-prueba.apk distribution/InterFlashTV-OwnTV-source-v0.19.zip
          gh release edit v0.19 --repo "$GITHUB_REPOSITORY" --draft=false --latest
