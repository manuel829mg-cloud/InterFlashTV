name: Publish Inter Flash TV Native Updater trial APK
on:
  push:
    branches: [test-native-updater-20261029]
    paths: [.github/workflows/publish-owntv-test.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for isolated live HUD build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 40821051334 --repo manuel829mg-cloud/InterFlashTV --exit-status --interval 15
      - name: Download the verified test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 40821051334 --repo manuel829mg-cloud/InterFlashTV -n InterFlashTV-NativeUpdater-EXPERIMENT-APK -D dist
          APK=$(find dist -type f -name '*.apk' | head -n 1)
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" InterFlashTV-Prueba-Reparacion-Vinculo.apk
      - name: Publish test-only APK without changing customer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create owntv-interflash-repair-pairing-test-20261029 InterFlashTV-Prueba-Reparacion-Vinculo.apk \
            --repo manuel829mg-cloud/InterFlashTV \
            --target b885d9e30782abb1860ee5956c637c97644342b8 \
            --title "Inter Flash TV - Reparar canales tras actualizacion (prueba)" \
            --notes "Prueba aislada: restaura perfil local al arrancar si falta y fuerza sincronizacion si falta la fuente. Conserva la barra inferior. No distribuible a clientes hasta verificar firma e instalacion encima de APK previa. No se ha validado aún en TV real; no distribuir a clientes. Proyecto OwnTV GPLv3 https://github.com/ahXN00/OwnTV" \
            --prerelease --latest=false
