name: Publish Inter Flash TV Fast Tune trial APK
on:
  push:
    branches: [test-fast-channel-tune-20261028]
    paths: [.github/workflows/publish-owntv-test.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the verified test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 40809591471 --repo manuel829mg-cloud/InterFlashTV -n InterFlashTV-Fast-Tune-EXPERIMENT-APK -D dist
          APK=$(find dist -type f -name '*.apk' | head -n 1)
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" InterFlashTV-Prueba-Cambio-Rapido.apk
      - name: Publish test-only APK without changing customer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create owntv-interflash-fast-tune-test-20261028 InterFlashTV-Prueba-Cambio-Rapido.apk \
            --repo manuel829mg-cloud/InterFlashTV \
            --target d0874efb36d81464905efc52201773f3ff25bda5 \
            --title "Inter Flash TV - Apertura rapida (prueba)" \
            --notes "Versión de prueba para un solo televisor: cambia el búfer inicial de reproducción de 1000 ms a 800 ms, mantiene el búfer tras cortes y conserva Canales Dominicanos. No se ha validado aún en TV real; no distribuir a clientes. Proyecto OwnTV GPLv3 https://github.com/ahXN00/OwnTV" \
            --prerelease --latest=false
