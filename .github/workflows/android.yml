name: Compilar APK
on:
  push:
    branches: [main, fix/tv-subscription-access-review]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: InterFlashTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK directamente (solo rama principal)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-v12
          name: Inter Flash TV Nueva — sincronización con la plataforma
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          prerelease: true

      - name: Publicar APK de prueba para Downloader
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/tv-subscription-access-review')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: interflashtv-firetv-nueva-web-20261028
          name: Inter Flash TV - APK de prueba para Fire TV
          body: "APK de prueba, no es versión final. La vinculación, cobros y suspensión requieren validación antes de su uso comercial."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
          prerelease: true
