<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inter Flash TV</title><style>
:root{font-family:Arial,sans-serif;color:#f1f5ff;background:#070f20}*{box-sizing:border-box}body{margin:0;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}h1{font-size:22px;margin:0;color:#f2ca3d}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(245px,1fr);gap:12px}.player{background:#000;aspect-ratio:16/9;min-height:210px;border-radius:12px;overflow:hidden}video{width:100%;height:100%;background:black;object-fit:contain}.tv-channels,.card{background:#13213a;padding:14px;border-radius:12px}.tv-channels h2{margin:0 0 10px;font-size:18px}input,select{width:100%;padding:10px;background:#243954;color:white;border:1px solid #4a6077;border-radius:8px;margin-bottom:8px;font-size:16px}#channelList{overflow-y:auto;max-height:68vh;display:grid;gap:4px}#channelList button{display:flex;align-items:center;gap:8px;width:100%;padding:12px;background:#203655;color:white;border:0;border-radius:7px;text-align:left;font-size:16px;cursor:pointer}#channelList button:focus,#channelList button.selected{background:#3e648b;outline:2px solid #f2ca3d}#channelList img{width:35px;height:30px;object-fit:contain}.muted{color:#b0c1d6}#msg{font-size:14px;margin:10px 0}#count{font-size:12px;color:#a9c1dc}@media(max-width:760px){.layout{grid-template-columns:1fr}#channelList{max-height:44vh}}
</style></head><body>
<header><h1>Inter Flash TV</h1><span class="muted" id="connection">Esperando vinculación con la plataforma...</span></header>
<div class="layout"><div><div class="player"><video id="video" autoplay playsinline controls></video></div><p id="msg" class="muted">Vincula el televisor desde el panel Inter Flash TV para recibir tus canales.</p></div>
<section class="tv-channels"><h2>Canales</h2><select id="category"><option value="">Todas las categorías</option></select><input id="searchChannel" type="search" placeholder="Buscar canal" autocomplete="off"><p id="count">0 canales</p><div id="channelList"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script><script>
(function(){
'use strict';
const video=document.getElementById('video'),list=document.getElementById('channelList'),search=document.getElementById('searchChannel'),category=document.getElementById('category'),msg=document.getElementById('msg');
let channels=[],hls=null,current=null;
function stop(){video.pause();if(hls){hls.destroy();hls=null;}video.removeAttribute('src');video.load();}
function play(ch){stop();current=ch;msg.textContent='Reproduciendo: '+ch.name;const url=ch.url;
 if(/\.m3u8(?:\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){hls=new Hls({backBufferLength:10,maxBufferLength:30});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_e,data)=>{if(data.fatal)msg.textContent='No se pudo reproducir este canal.';});}
 else{video.src=url;video.play().catch(()=>{msg.textContent='Pulsa reproducir para iniciar el canal.';});}
 for(const b of list.querySelectorAll('button'))b.classList.toggle('selected',b.dataset.channelName===ch.name);
}
function render(){const q=search.value.toLowerCase(),cat=category.value;list.textContent='';const matches=channels.filter(c=>(!cat||c.group===cat)&&c.name.toLowerCase().includes(q));
 for(const ch of matches){const b=document.createElement('button');b.type='button';b.dataset.channelName=ch.name;
 if(ch.logo){const img=document.createElement('img');img.src=ch.logo;img.alt='';img.onerror=()=>img.remove();b.appendChild(img);}
 const label=document.createElement('span');label.textContent=ch.name;b.appendChild(label);b.addEventListener('click',()=>play(ch));list.appendChild(b);}
 document.getElementById('count').textContent=matches.length+' canales';
}
window.importCustomM3U=function(raw,name){
 if(typeof raw!=='string'||!raw.startsWith('#EXTM3U'))return false;
 const lines=raw.replace(/\r/g,'').split('\n');let info=null;const parsed=[];
 for(const line of lines){const s=line.trim();if(s.startsWith('#EXTINF:')){const title=s.slice(s.lastIndexOf(',')+1).trim();const group=(s.match(/group-title="([^"]*)"/i)||[])[1]||'General';const logo=(s.match(/tvg-logo="([^"]*)"/i)||[])[1]||'';info={name:title||'Canal',group,logo};}
 else if(s&& !s.startsWith('#')&&info){try{const u=new URL(s);if(u.protocol==='https:'||u.protocol==='http:')parsed.push({...info,url:u.href});}catch(e){}info=null;}
 }
 stop();channels=parsed;category.replaceChildren(new Option('Todas las categorías',''));for(const g of [...new Set(channels.map(c=>c.group))].sort())category.add(new Option(g,g));search.value='';render();
 document.getElementById('connection').textContent=name||'Inter Flash TV';
 msg.textContent=channels.length?'Selecciona un canal para comenzar.':'La lista recibida no contiene canales válidos.';
 return true;
};
search.addEventListener('input',render);category.addEventListener('change',render);
window.addEventListener('pagehide',stop);
})();
</script></body></html>
